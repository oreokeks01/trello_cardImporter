<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trello Bulk Importer V3</title><link rel="stylesheet" href="style.css"></head>
<body><main class="landing"><div class="brand">🧠 STUDY CARDS · V3</div><h1>Trello Bulk Importer</h1><p>CSV-Datei hochladen, Lernkarten prüfen und direkt in dein Trello-Board importieren.</p><a class="primary linkbutton" href="./importer.html">CSV-Importer öffnen</a><p class="muted">Der CSV-Upload funktioniert auch als Vorschau im Browser. Für den Import öffne das Power-Up in Trello.</p></main>
<script src="./config.js"></script><script src="https://p.trellocdn.com/power-up.min.js"></script><script>
if(window.TrelloPowerUp){
  const cfg=window.STUDY_CARDS_CONFIG;
  window.TrelloPowerUp.initialize({
    'board-buttons': function(t){return [{text:'🧠 CSV importieren',condition:'edit',callback:function(t){return t.modal({title:'Trello Bulk Importer',url:'./importer.html',fullscreen:true});}}];}
  },{appKey:cfg.appKey,appName:cfg.appName});
}
</script></body></html>
